[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-SRE_Env"
version = "0.1.0"
description = "Sre Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    "openenv-core[core]>=0.2.2",
    # SRE environment core dependencies
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Local (desktop) mode with Docker
local = [
    "docker>=6.0.0",        # Docker SDK for Python (container pool management)
    "paramiko>=3.0.0",      # SSH client (agent SSH sessions)
]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
server = "server.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "__pycache__*", "*.egg-info*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
