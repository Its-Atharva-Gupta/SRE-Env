[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-SRE_Env"
version = "0.1.0"
description = "Sre Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "requests",
    "psutil",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "trl>=0.29.0",
    "accelerate",
    "datasets",
    "wandb",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "__pycache__*", "*.egg-info*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
